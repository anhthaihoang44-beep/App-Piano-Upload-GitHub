name: PianoFlow
options:
  bundleIdPrefix: com.pianoflow
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - vi
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PianoFlow:
    type: application
    platform: iOS
    sources:
      - path: PianoFlow
        excludes:
          - "Resources/Info.plist"
          - "Resources/PianoFlow.storekit"
      - path: PianoFlow/Resources/PianoFlow.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pianoflow.app
        INFOPLIST_FILE: PianoFlow/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - PianoFlowTests
      storeKitConfiguration: PianoFlow/Resources/PianoFlow.storekit
  PianoFlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PianoFlowTests
    dependencies:
      - target: PianoFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pianoflow.app.tests
        GENERATE_INFOPLIST_FILE: YES

name: Build iOS Unsigned IPA (Sideloadly)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Build Unsigned IPA & Run Swift Tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode & iOS Simulators
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Run SwiftPM Unit Tests
        working-directory: ios
        run: swift test

      - name: Run Xcode Unit Tests (iOS Simulator)
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available iPhone | grep -E 'iPhone 16|iPhone 15|iPhone 14' | grep -v 'SE' | grep -E '\([A-F0-9-]+\)' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available iPhone | grep -E '\([A-F0-9-]+\)' | head -n 1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Using Simulator ID: $DEST"
          xcrun simctl boot "$DEST" || true
          xcrun simctl bootstatus "$DEST" -b
          xcodebuild test \
            -project PianoFlow.xcodeproj \
            -scheme PianoFlow \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath DerivedDataSim

      - name: Build PianoFlow.app (Release, Unsigned for Sideloadly)
        working-directory: ios
        run: |
          xcodebuild \
            -project PianoFlow.xcodeproj \
            -scheme PianoFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Unsigned .ipa (Payload/PianoFlow.app)
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PianoFlow.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: PianoFlow.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p ipa_out/Payload
          cp -R "$APP_PATH" ipa_out/Payload/
          cd ipa_out
          zip -qry ../PianoFlow-unsigned.ipa Payload
          ls -lh ../PianoFlow-unsigned.ipa

      - name: Upload PianoFlow-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoFlow-unsigned-ipa
          path: ios/PianoFlow-unsigned.ipa
          retention-days: 30
